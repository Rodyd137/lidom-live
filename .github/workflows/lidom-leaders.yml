name: scrape-lidom-leaders

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * 10,11,12,1,2 *"   # cada ~10 min (UTC)

permissions:
  contents: write

concurrency:
  group: scrape-lidom-leaders
  cancel-in-progress: true

env:
  TZ: America/Santo_Domingo
  LIDOM_STATS_URL: https://estadisticas.lidom.com/Lider

jobs:
  leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-auth remote with token
        run: git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps (docs/)
        run: |
          if [ -f docs/package-lock.json ]; then
            npm ci --prefix docs
          else
            npm i --prefix docs --no-fund --no-audit
          fi
          [ -e node_modules ] || ln -s docs/node_modules node_modules

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Localizar script de líderes
        id: findscript
        run: |
          set -euo pipefail
          SCRIPT_PATH="$(git ls-files | grep -E '(^|/)lidom_stats\.mjs$' | head -n1 || true)"
          if [ -z "${SCRIPT_PATH}" ]; then
            echo "ERROR: No se encontró lidom_stats.mjs en el repo."
            echo "Estructura del repo (nivel 2):"
            find . -maxdepth 2 -type f | sed 's|^\./||' | sort | head -n 200
            exit 1
          fi
          echo "Encontrado: ${SCRIPT_PATH}"
          echo "script=${SCRIPT_PATH}" >> "$GITHUB_OUTPUT"

      # Probe tolerante: si estadisticas.lidom.com no responde (p.ej. temporada
      # muerta o servidor caído) NO se falla el job; se marca up=false y se omite
      # el scrape para no inundar de correos "run failed".
      - name: Verificar disponibilidad de la página
        id: probe
        run: |
          if curl -fsSLk --retry 2 --max-time 20 "$LIDOM_STATS_URL" >/dev/null 2>&1; then
            echo "up=true" >> "$GITHUB_OUTPUT"
            echo "✅ estadisticas.lidom.com responde."
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=LIDOM offline::estadisticas.lidom.com no responde (probable temporada muerta). Se omite el scrape de líderes y el job termina en éxito."
          fi

      - name: Scrape líderes (bateo/pitcheo)
        if: steps.probe.outputs.up == 'true'
        run: |
          set -euo pipefail
          # Permitir TLS inseguro SOLO en este proceso Node (cert vencido del sitio)
          NODE_TLS_REJECT_UNAUTHORIZED=0 node "${{ steps.findscript.outputs.script }}"
          test -s docs/stats/lideres.json || (echo 'ERROR: no se generó docs/stats/lideres.json' && exit 4)
          jq . docs/stats/lideres.json >/dev/null

      - name: Commit & push (solo líderes)
        if: steps.probe.outputs.up == 'true'
        run: |
          if ! git diff --quiet -- docs/stats/lideres.json; then
            git add docs/stats/lideres.json
            TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "chore(leaders): update ${TS} [skip ci]" || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          else
            echo "No changes en líderes."
          fi
